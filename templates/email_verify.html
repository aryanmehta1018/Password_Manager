<!DOCTYPE html>
<html>
<head>
    <title>Email Verification</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #f5f7fb;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
        }
        .card {
            background: white;
            width: 380px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        .otp-box {
            width: 50px;
            height: 55px;
            font-size: 22px;
            text-align: center;
            margin: 0 4px;
        }
        #resendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body class="{% if current_user.is_authenticated and current_user.pref_dark_mode %}dark{% endif %}">


<div class="card">

    <h3 class="mb-3">Verify Your Email</h3>
    <p class="text-muted mb-3">Enter the 6-digit OTP sent to your email.</p>

    <form method="POST" id="otpForm">
        <div class="d-flex justify-content-center mb-3">
            <input maxlength="1" class="otp-box form-control" id="otp1">
            <input maxlength="1" class="otp-box form-control" id="otp2">
            <input maxlength="1" class="otp-box form-control" id="otp3">
            <input maxlength="1" class="otp-box form-control" id="otp4">
            <input maxlength="1" class="otp-box form-control" id="otp5">
            <input maxlength="1" class="otp-box form-control" id="otp6">
        </div>

        <input type="hidden" name="otp" id="finalOtp">

        <button class="btn btn-primary w-100">Verify OTP</button>
    </form>

    <hr>

    <p class="text-muted mt-2">Resend OTP in <span id="timer">30</span>s</p>

    <button class="btn btn-outline-primary w-100 mt-2" id="resendBtn" disabled>
        Resend OTP
    </button>

</div>


<script>

const TIMER_KEY = "otp_expiry_time";
let expiryTime = sessionStorage.getItem(TIMER_KEY);


if (!expiryTime) {
    expiryTime = Date.now() + 30000;
    sessionStorage.setItem(TIMER_KEY, expiryTime);
}

function updateTimer() {
    const now = Date.now();
    let remaining = Math.floor((expiryTime - now) / 1000);

    if (remaining <= 0) {
        document.getElementById("timer").innerText = "0";
        document.getElementById("resendBtn").disabled = false;
        return;
    }

    document.getElementById("timer").innerText = remaining;
    setTimeout(updateTimer, 500);
}

updateTimer();



const boxes = ["otp1", "otp2", "otp3", "otp4", "otp5", "otp6"];

boxes.forEach((id, index) => {
    const box = document.getElementById(id);

    box.addEventListener("input", () => {
        if (box.value.length === 1 && index < 5) {
            document.getElementById(boxes[index + 1]).focus();
        }
        updateFinalOtp();
    });

    box.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && index > 0 && box.value === "") {
            document.getElementById(boxes[index - 1]).focus();
        }
    });
});

function updateFinalOtp() {
    let otp = "";
    boxes.forEach(id => otp += document.getElementById(id).value);
    document.getElementById("finalOtp").value = otp;
}



document.getElementById("resendBtn").addEventListener("click", async () => {
    const btn = document.getElementById("resendBtn");
    btn.disabled = true;

    const res = await fetch("/resend_otp", {
        method: "POST"
    });

    const data = await res.json();

    if (data.success) {
        alert("OTP sent again!");

        
        expiryTime = Date.now() + 30000;
        sessionStorage.setItem(TIMER_KEY, expiryTime);
        updateTimer();
    } else {
        alert(data.message || "Failed to resend OTP");
    }
});
</script>

</body>
</html>
