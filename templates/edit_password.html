<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #fff;
            padding: 35px;
            width: 100%;
            max-width: 420px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        h2 {
            margin-bottom: 20px;
            text-align: center;
        }

        label {
            font-weight: 600;
            margin-top: 12px;
            display: block;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        .hint {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-top: 8px;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Edit Password</h2>

    <form method="POST">
        <label>Website</label>
        <input type="text" name="website" value="{{ password.website }}" required>

        <label>Username</label>
        <input type="text" name="username" value="{{ password.username }}" required>

        <label>New Password (optional)</label>
        <input type="password" name="password">
        <div class="hint">Leave blank to keep existing password</div>

        <label>Category</label>
        <select name="category">
            {% for cat in ["General","Social","Work","Finance","Entertainment"] %}
            <option value="{{ cat }}" {% if password.category == cat %}selected{% endif %}>
                {{ cat }}
            </option>
            {% endfor %}
        </select>

        <label>Notes</label>
        <textarea name="notes" rows="3">{{ password.notes }}</textarea>

        <button type="submit">Save Changes</button>
    </form>

    <a href="/dashboard">← Back to Dashboard</a>
</div>

</body>
</html>
