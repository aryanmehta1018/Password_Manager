<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --bg: #f4f6f9;
            --card: #ffffff;
            --text: #2c3e50;
            --subtext: #7f8c8d;
            --primary: #3498db;
            --border: #dcdde1;
            --danger: #e74c3c;
        }

        body.dark {
            --bg: #1e272e;
            --card: #2f3640;
            --text: #ecf0f1;
            --subtext: #95a5a6;
            --border: #57606f;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: var(--card);
            padding: 35px;
            width: 100%;
            max-width: 420px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,.15);
            text-align: center;
        }

        .icon {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 5px;
        }

        p {
            color: var(--subtext);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 1rem;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background: #2980b9;
        }

        .back {
            margin-top: 18px;
            display: block;
            color: var(--subtext);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="{% if current_user.is_authenticated and current_user.pref_dark_mode %}dark{% endif %}">

<div class="card">
    <div class="icon"><i class="fas fa-unlock-keyhole"></i></div>
    <h2>Forgot Password?</h2>
    <p>Enter your email and we’ll send you a password reset link.</p>

    <form method="POST">
        <input type="email" name="email" placeholder="Email address" required>
        <button type="submit">Send Reset Link</button>
    </form>

    <a class="back" href="/login">← Back to Login</a>
</div>

</body>
</html>
