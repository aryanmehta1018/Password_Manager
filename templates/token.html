<!doctype html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <title>API Token</title>
</head>
<body class="{% if current_user.is_authenticated and current_user.pref_dark_mode %}dark{% endif %}">


<div class="card" style="text-align:center;">
    <h2>Your API Token</h2>

    <p style="font-size:17px; background:#f3f3f3; padding:15px; border-radius:10px;">
        {{ token }}
    </p>

    <p>Copy this token and paste it in your Chrome Extension</p>

    <a href="/dashboard">⬅ Back</a>
</div>

</body>
</html>
