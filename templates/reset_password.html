<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --bg: #f4f6f9;
            --card: #ffffff;
            --text: #2c3e50;
            --subtext: #7f8c8d;
            --primary: #3498db;
            --danger: #e74c3c;
            --border: #dcdde1;
        }

        body.dark {
            --bg: #1e272e;
            --card: #2f3640;
            --text: #ecf0f1;
            --subtext: #95a5a6;
            --border: #57606f;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: var(--card);
            padding: 35px;
            width: 100%;
            max-width: 420px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,.15);
            text-align: center;
        }

        .icon {
            font-size: 2.4rem;
            color: var(--primary);
            margin-bottom: 12px;
        }

        h2 {
            margin-bottom: 5px;
        }

        p {
            color: var(--subtext);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 1rem;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background: #2980b9;
        }

        .hint {
            font-size: 0.85rem;
            color: var(--subtext);
            margin-top: 10px;
        }
    </style>
</head>

<body class="{% if current_user.is_authenticated and current_user.pref_dark_mode %}dark{% endif %}">

<div class="card">
    <div class="icon"><i class="fas fa-lock"></i></div>
    <h2>Reset Your Password</h2>
    <p>Choose a strong new password for your account.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, msg in messages %}
            <div class="flash {{ category }}">{{ msg }}</div>
        {% endfor %}
    {% endwith %}


    <form method="POST"
        action="{{ url_for('reset_password', token=token) }}"
        onsubmit="this.querySelector('button').disabled=true;
            this.querySelector('button').innerText='Updating...';">

        <input type="password" name="password" placeholder="New password" required>
        <input type="password" name="confirm_password" placeholder="Confirm password" required>
        <button type="submit" class="btn btn-primary">
            Reset Password
        </button>

    </form>

    <div class="hint">
        Use at least 8 characters with a mix of letters, numbers & symbols.
    </div>
</div>

</body>
</html>
