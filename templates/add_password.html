<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Password | Vault</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.add-card {
    width: 100%;
    max-width: 430px;
    padding: 35px 30px;
    border-radius: 18px;
    background: rgba(255,255,255,0.95);
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
    animation: fadeIn 0.7s ease;
}

@keyframes fadeIn {
    from { opacity:0; transform:translateY(-15px); }
    to { opacity:1; transform:translateY(0); }
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header i {
    font-size: 2.6rem;
    color: #667eea;
}

.header h1 {
    margin-top: 8px;
    font-size: 1.7rem;
    color: #2c3e50;
}

.header p {
    font-size: 0.9rem;
    color: #7f8c8d;
}

form {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.field {
    position: relative;
}

.field i {
    position: absolute;
    top: 50%;
    left: 14px;
    transform: translateY(-50%);
    color: #95a5a6;
}

input, select, textarea {
    width: 100%;
    padding: 12px 14px 12px 40px;
    border-radius: 10px;
    border: 1px solid #dcdde1;
    font-size: 0.95rem;
    transition: 0.25s;
}

textarea {
    resize: none;
}

input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102,126,234,.15);
}

.password-actions {
    display: flex;
    gap: 8px;
}

.password-actions button {
    flex: 1;
}

.btn {
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
    transition: 0.25s;
}

.btn-primary {
    background: linear-gradient(135deg, #667eea, #5a67d8);
    color: white;
}

.btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 15px rgba(102,126,234,.35);
}

.btn-secondary {
    background: #2ecc71;
    color: white;
}

.btn-secondary:hover {
    background: #27ae60;
}

.footer {
    text-align: center;
    margin-top: 20px;
}

.footer a {
    text-decoration: none;
    font-weight: 600;
    color: #667eea;
}

.footer a:hover {
    text-decoration: underline;
}

/* Flash messages */
.flash {
    padding: 12px;
    border-radius: 10px;
    font-weight: 600;
    margin-bottom: 10px;
    text-align: center;
}

.flash.success { background:#d4edda; color:#155724; }
.flash.danger { background:#f8d7da; color:#721c24; }
.flash.info { background:#cce5ff; color:#004085; }

</style>
</head>

<body>

<div class="add-card">

    <div class="header">
        <i class="fas fa-vault"></i>
        <h1>Add to Vault</h1>
        <p>Securely store your credentials</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">

        <div class="field">
            <i class="fas fa-globe"></i>
            <input type="text" name="website" placeholder="Website (e.g. github.com)" required>
        </div>

        <div class="field">
            <i class="fas fa-user"></i>
            <input type="text" name="username" placeholder="Username / Email" required>
        </div>

        <div class="field">
            <i class="fas fa-lock"></i>
            <input type="password" id="passwordField" name="password" placeholder="Password" required>
        </div>

        <div class="password-actions">
            <button type="button" class="btn btn-secondary" onclick="generatePassword()">
                <i class="fas fa-wand-magic-sparkles"></i> Generate
            </button>
            <button type="button" class="btn btn-secondary" onclick="togglePassword()">
                <i class="fas fa-eye"></i> Show
            </button>
        </div>

        <div class="field">
            <i class="fas fa-tag"></i>
            <select name="category">
                <option>General</option>
                <option>Social</option>
                <option>Work</option>
                <option>Finance</option>
                <option>Entertainment</option>
            </select>
        </div>

        <div class="field">
            <i class="fas fa-note-sticky"></i>
            <textarea name="notes" rows="3" placeholder="Notes (optional)"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Save to Vault
        </button>

    </form>

    <div class="footer">
        <a href="/dashboard">← Back to Dashboard</a>
    </div>

</div>

<script>
function generatePassword(){
    const charset =
        "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+{}[]<>?";
    let pwd = "";
    for(let i=0;i<14;i++){
        pwd += charset[Math.floor(Math.random()*charset.length)];
    }
    document.getElementById("passwordField").value = pwd;
}

function togglePassword(){
    const f = document.getElementById("passwordField");
    f.type = f.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
