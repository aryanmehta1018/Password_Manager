<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>
    <style>
        body {
            font-family: Segoe UI, sans-serif;
            background: #f4f6f9;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .card {
            background: white;
            width: 480px;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
            font-weight: 600;
            color: #2c3e50;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #bdc3c7;
            font-size: 1rem;
        }

        textarea {
            height: 80px;
        }

        .btn {
            margin-top: 18px;
            background: #3498db;
            padding: 12px;
            text-align: center;
            color: white;
            border: none;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #2980b9;
        }

        a.back {
            display: block;
            text-align: center;
            margin-top: 10px;
            color: #2980b9;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>

<body class="{% if current_user.is_authenticated and current_user.pref_dark_mode %}dark{% endif %}">

    <div class="card">
        <h2>Edit Profile</h2>

        <form method="POST">

            <label>Name</label>
            <input type="text" name="display_name" value="{{ user.display_name or '' }}">

            <label>Phone Number</label>
            <input type="text" name="phone" value="{{ user.phone or '' }}">




            <button class="btn">Save</button>
        </form>

        <a href="/profile" class="back">← Back to Profile</a>
    </div>
</body>
</html>
